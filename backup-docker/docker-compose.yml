services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: site-cms-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
